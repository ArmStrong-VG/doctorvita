<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DoctorVita – Website im Aufbau</title>
<meta name="description" content="Die neue Website von DoctorVita entsteht gerade.">
<style>
:root{--blue:#16697a;--teal:#2a9d8f;--text:#24343a;--muted:#63767d;--bg:#f5fbfa;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:linear-gradient(145deg,#f8fcfc,#eaf7f5);min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(720px,100%);background:var(--card);border-radius:24px;padding:56px 38px;text-align:center;box-shadow:0 18px 55px rgba(20,70,80,.12);border:1px solid #e3f0ee}.mark{width:72px;height:72px;margin:0 auto 22px;border-radius:50%;background:var(--teal);color:white;display:grid;place-items:center;font-size:38px;font-weight:700}.brand{font-size:clamp(38px,8vw,58px);margin:0;color:var(--blue);letter-spacing:-1px}.line{width:64px;height:4px;border-radius:4px;background:var(--teal);margin:22px auto 28px}h2{font-size:clamp(23px,5vw,32px);margin:0 0 18px}p{font-size:18px;line-height:1.65;margin:0 auto;max-width:560px;color:var(--muted)}.thanks{margin-top:25px;color:var(--text);font-weight:700}.instagram{display:inline-flex;align-items:center;gap:10px;margin-top:30px;padding:13px 22px;border-radius:999px;background:#16697a;color:#fff;text-decoration:none;font-size:16px;font-weight:700;transition:background .2s,transform .2s}.instagram:hover{background:#2a9d8f;transform:translateY(-1px)}.instagram:focus-visible{outline:3px solid #f0ad4e;outline-offset:3px}.instagram-icon{font-size:20px;line-height:1}@media(max-width:520px){.card{padding:42px 24px;border-radius:18px}p{font-size:16px}}
</style>
</head>
<body>
<main class="card">
<div class="mark" aria-hidden="true">+</div>
<h1 class="brand">DoctorVita</h1>
<div class="line"></div>
<h2>Unsere neue Website entsteht gerade.</h2>
<p>In Kürze finden Sie hier weitere Informationen zu unserer Praxis und unseren Leistungen.</p>
<p class="thanks">Vielen Dank für Ihr Interesse.<br>Wir freuen uns auf Ihren Besuch!</p>
<a class="instagram" href="https://www.instagram.com/eure.doktor.vita?avpt=YzBpN3E4NmdnaXh4" target="_blank" rel="noopener noreferrer" aria-label="DoctorVita auf Instagram besuchen"><span class="instagram-icon" aria-hidden="true">◎</span>DoctorVita auf Instagram</a>
</main>
</body>
</html>
